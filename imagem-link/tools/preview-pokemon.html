<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pokémon</title>
    <script type="importmap">{ "imports": { "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm": "./mock.js" } }</script>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="poke">
    <nav class="tabs">
      <a href="preview.html">Link</a>
      <a href="preview-pokemon.html" class="on">Pokémon</a>
    </nav>
    <main>
      <input id="q" type="search" placeholder="Buscar por nome, número ou forma (ex.: charizard, 25, fêmea)" autocomplete="off" />
      <div class="row small opts">
        <span class="muted">Tamanho:</span>
        <div class="seg mini" id="size">
          <button type="button" data-v="1" class="on">1</button>
          <button type="button" data-v="2">2</button>
          <button type="button" data-v="3">3</button>
          <button type="button" data-v="4">4</button>
          <button type="button" data-v="real" title="Proporcional ao sprite: Pokémon grandes ficam maiores">Sprite</button>
        </div>
      </div>
      <label class="check small"><input id="swap" type="checkbox" /> Trocar a imagem do token selecionado (evolução, forma…)</label>
      <div id="count" class="muted small"></div>
      <div id="grid" class="pgrid"></div>
      <button id="more" type="button" class="hidden">Mostrar mais</button>
    </main>
    <script type="module" src="../pokemon.js"></script>
  </body>
</html>
